<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2B Овощи</title>

<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;800&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#0d0d0d;--surface:#161616;--surface2:#1f1f1f;--border:#2a2a2a;
  --accent:#e8ff47;--accent2:#ff6b35;--text:#f0f0f0;--muted:#888;
  --danger:#ff4444;--success:#44ff88;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Golos Text',sans-serif}

nav{position:sticky;top:0;background:#0d0d0deb;padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.logo{font-family:'Unbounded';font-weight:800;cursor:pointer}
.logo span{color:var(--accent)}

.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer}
.btn-accent{background:var(--accent);color:#000;font-weight:700}

.view{display:none}
.view.active{display:block}

.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:20px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.name{font-family:'Unbounded';font-weight:600}
.price{color:var(--accent);font-weight:700;margin-top:6px}

.qty{display:flex;gap:10px;align-items:center;margin-top:10px}
.qty button{width:32px;height:32px}

.cartbar{position:fixed;bottom:0;left:0;right:0;background:#111;padding:14px;display:none;justify-content:space-between}
</style>
</head>

<body>

<nav>
  <div class="logo" onclick="secret()">B2B <span>Овощи</span></div>
  <button class="btn" onclick="show('cart')" id="cartBtn" style="display:none">
    Корзина <span id="total"></span>
  </button>
</nav>

<div id="shop" class="view active">
  <div class="products" id="grid">Загрузка...</div>
</div>

<div id="cart" class="view">
  <div style="padding:20px">
    <h2>Корзина</h2>
    <div id="cartList"></div>

    <input id="name" placeholder="Имя">
    <input id="phone" placeholder="Телефон">
    <input id="address" placeholder="Адрес">

    <button class="btn btn-accent" onclick="send()">Отправить в WhatsApp</button>
  </div>
</div>

<script>

const SUPABASE_URL = "https://izzqhixtzxkjiwyquvri.supabase.co";
const SUPABASE_KEY = "YOUR_KEY";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let products = [];
let cart = JSON.parse(localStorage.getItem('cart')||'{}');

function saveCart(){
  localStorage.setItem('cart', JSON.stringify(cart));
}

function fmt(n){
  return new Intl.NumberFormat('ru-RU',{style:'currency',currency:'KZT'}).format(n||0);
}

async function load(){
  const { data } = await sb.from('products').select('*');
  products = data || [];
  render();
}

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = products.map(p=>{
    const q = cart[p.id]||0;
    return `
    <div class="card">
      <div class="name">${escape(p.name)}</div>
      <div>${escape(p.desc||'')}</div>
      <div class="price">${fmt(p.price)}</div>

      <div class="qty">
        <button onclick="chg(${p.id},-1)">-</button>
        <b>${q}</b>
        <button onclick="chg(${p.id},1)">+</button>
      </div>
    </div>`;
  }).join('');
  update();
}

function chg(id,d){
  cart[id]=(cart[id]||0)+d;
  if(cart[id]<=0) delete cart[id];
  saveCart();
  render();
}

function total(){
  return Object.entries(cart).reduce((s,[id,q])=>{
    const p = products.find(x=>x.id==id);
    return s+(p?.price||0)*q;
  },0);
}

function update(){
  document.getElementById('total').innerText = fmt(total());
  document.getElementById('cartBtn').style.display = Object.keys(cart).length?'block':'none';
}

function show(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.getElementById(v).classList.add('active');
  if(v==='cart') renderCart();
}

function renderCart(){
  const el = document.getElementById('cartList');
  el.innerHTML = Object.entries(cart).map(([id,q])=>{
    const p = products.find(x=>x.id==id);
    return `<div>${p?.name} × ${q}</div>`;
  }).join('');
}

function buildMsg(){
  let msg = "🧾 ЗАКАЗ\n\n";
  Object.entries(cart).forEach(([id,q])=>{
    const p = products.find(x=>x.id==id);
    msg += `- ${p.name} × ${q} = ${fmt(p.price*q)}\n`;
  });
  msg += `\nИТОГО: ${fmt(total())}`;
  return msg;
}

function wa(phone,text){
  const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
  window.open(url,'_blank') || (location.href=url);
}

async function send(){

  const name = document.getElementById('name').value;
  const phone = document.getElementById('phone').value;
  const address = document.getElementById('address').value;

  if(!name||!phone||!address) return alert('Заполни данные');

  const order = {
    name,
    phone,
    address,
    total: total(),
    status:'new',
    created_at:new Date().toISOString()
  };

  await sb.from('orders').insert([order]);

  wa("77054959007", buildMsg());

  cart={};
  saveCart();
  render();
  show('shop');

  alert('Заказ отправлен');
}

function escape(s){
  return String(s||'').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[m]));
}

function secret(){
  let c=0;
  return ()=>{ c++; if(c>=5) alert('admin mode'); }
}

load();

</script>
</body>
</html>
