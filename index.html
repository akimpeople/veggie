<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магазин Свежих Овощей</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bg: #0d0d0d; --surface: #161616; --accent: #e8ff47; --success: #44ff88; --text: #fff; --muted: #888; }
  body { background: var(--bg); color: var(--text); font-family: 'Golos Text', sans-serif; margin: 0; padding-bottom: 80px; }
  
  nav { display: flex; align-items: center; justify-content: space-between; padding: 20px; border-bottom: 1px solid #2a2a2a; position: sticky; top: 0; background: rgba(13,13,13,0.95); z-index: 100; }
  .logo { font-family: 'Unbounded', sans-serif; font-size: 14px; line-height: 1.2; user-select: none; }
  .logo span { color: var(--accent); }
  
  .btn-cart { background: var(--success); color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 800; font-size: 14px; cursor: pointer; }
  
  .products-grid { padding: 20px; display: grid; gap: 12px; }
  .product-card { background: var(--surface); padding: 16px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; }
  .p-name { font-weight: 600; font-size: 15px; }
  .p-price { font-family: 'Unbounded', sans-serif; color: var(--accent); font-size: 13px; }
  
  .qty-ctrl { display: flex; align-items: center; gap: 10px; }
  .btn-qty { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #333; background: #222; color: #fff; font-size: 18px; cursor: pointer; }
  
  .view { display: none; } .view.active { display: block; }
  
  .cart-container { padding: 20px; max-width: 500px; margin: 0 auto; }
  .invoice-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #222; font-size: 14px; }
  .input-field { width: 100%; padding: 14px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; margin-bottom: 10px; }
</style>
</head>
<body>

<nav>
  <div class="logo" onclick="secretLogin()">МАГАЗИН<br><span>СВЕЖИХ ОВОЩЕЙ</span></div>
  <button id="cartNavBtn" class="btn-cart" style="display:none" onclick="showView('cart')">
    ОФОРМИТЬ (<span id="navTotal">0 ₸</span>)
  </button>
</nav>

<div id="shopView" class="view active">
  <div class="products-grid" id="productsGrid">Загрузка товаров...</div>
</div>

<div id="cartView" class="view">
  <div class="cart-container">
    <button onclick="showView('shop')" style="background:none; border:none; color:var(--muted); margin-bottom:20px;">← Назад к покупкам</button>
    <h2 style="font-family:'Unbounded',sans-serif; margin-bottom:20px;">Накладная</h2>
    <div id="cartItemsList"></div>
    <div id="cartSummary" style="font-size: 20px; font-weight: 800; color: var(--success); margin: 20px 0;"></div>
    
    <input type="text" id="fname" class="input-field" placeholder="Ваше Имя">
    <input type="tel" id="fphone" class="input-field" placeholder="Телефон">
    <input type="text" value="Астана" class="input-field" readonly>
    <input type="text" id="fstreet" class="input-field" placeholder="Адрес (ул, дом, кв)">
    
    <button class="btn-cart" style="width:100%; padding: 20px; font-size: 16px;" onclick="submitOrder()">ОТПРАВИТЬ ЗАКАЗ</button>
  </div>
</div>

<script>
const { createClient } = window.supabase;
const supabase = createClient('https://izzqhixtzxkjiwyquvri.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6enFoaXh0enhraml3eXF1dnJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTIwODEsImV4cCI6MjA5NTAyODA4MX0.5vrBFp2WTNFlxPkhuQgPDlhq5t20JZUETT3c_rD84aM');

let cart = {}, products = [];

async function init() {
  const { data } = await supabase.from('products').select('*');
  products = data || [];
  renderProducts();
}

function renderProducts(){
  document.getElementById('productsGrid').innerHTML = products.map(p => `
    <div class="product-card">
      <div class="product-info">
        <div class="p-name">${p.name}</div>
        <div class="p-price">${fmt(p.price)} / ${p.unit}</div>
      </div>
      <div class="qty-ctrl">
        <button class="btn-qty" onclick="changeQty(${p.id},-1)">−</button>
        <span style="font-weight:700">${cart[p.id]||0}</span>
        <button class="btn-qty" onclick="changeQty(${p.id},1)">+</button>
      </div>
    </div>`).join('');
}

function changeQty(id, delta){
  cart[id] = Math.max(0, (cart[id]||0) + delta);
  if(!cart[id]) delete cart[id];
  renderProducts(); updateCartUI();
}

function updateCartUI(){
  document.getElementById('navTotal').textContent = fmt(cartTotal());
  document.getElementById('cartNavBtn').style.display = Object.keys(cart).length ? 'block' : 'none';
}

function cartTotal(){ return Object.entries(cart).reduce((s,[id,q])=>{ const p=products.find(x=>x.id==id); return s+(p?p.price*q:0); },0); }

function renderCart(){
  const wrap = document.getElementById('cartItemsList');
  wrap.innerHTML = Object.entries(cart).map(([id,qty])=>{
    const p = products.find(x=>x.id==id);
    return `<div class="invoice-item">
      <div>${p.name}<br><small style="color:var(--muted)">${qty} ${p.unit} x ${fmt(p.price)}</small></div>
      <div class="qty-ctrl"><button class="btn-qty" style="width:28px;height:28px" onclick="changeQtyCart(${p.id},-1)">−</button> ${qty} <button class="btn-qty" style="width:28px;height:28px" onclick="changeQtyCart(${p.id},1)">+</button></div>
      <div style="font-weight:700">${fmt(p.price*qty)}</div>
    </div>`;
  }).join('');
  document.getElementById('cartSummary').textContent = 'ИТОГО: ' + fmt(cartTotal());
}

function changeQtyCart(id, delta){ changeQty(id, delta); renderCart(); }

async function submitOrder(){
  const name=document.getElementById('fname').value, street=document.getElementById('fstreet').value, phone=document.getElementById('fphone').value;
  if(!name || !street || !phone) return alert('Заполните все данные!');
  
  let msg = `НАКЛАДНАЯ\nКлиент: ${name}\nТелефон: ${phone}\nАдрес: Астана, ${street}\n\n`;
  Object.entries(cart).forEach(([id,q])=>{ const p=products.find(x=>x.id==id); msg += `• ${p.name}: ${q} ${p.unit} x ${p.price} = ${p.price*q} ₸\n`; });
  msg += `\nИТОГО: ${cartTotal()} ₸`;
  
  await supabase.from('orders').insert([{ name, phone, items: cart, total: cartTotal() }]);
  window.open(`https://wa.me/77054959007?text=${encodeURIComponent(msg)}`, '_blank');
}

let clicks=0; function secretLogin(){ if(++clicks >= 5) location.href='?admin=true'; }
function showView(id){ document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); document.getElementById(id+'View').classList.add('active'); if(id==='cart') renderCart(); }
function fmt(n){ return new Intl.NumberFormat('ru-RU',{style:'currency',currency:'KZT',minimumFractionDigits:0}).format(n); }
init();
</script>
</body>
</html>
